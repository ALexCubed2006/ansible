---
- name: Present Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: yes

- name: Start Nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: yes

- name: Copy Nginx config
  ansible.builtin.copy:
    src: nginx.conf
    dest: "{{ nginx_conf_path_dest }}"
    owner: root
    group: root
    mode: '644'
  notify: Reload nginx

- name: Disable Ubuntu default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Deploy site vhost
  ansible.builtin.template:
    src: default.j2
    dest: "/etc/nginx/sites-available/{{ site_server_name }}.conf"
  notify: Reload nginx

- name: Enable site vhost
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ site_server_name }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ site_server_name }}.conf"
    state: link
    force: true
  notify: Reload nginx

- name: Deploy WebSocket map
  ansible.builtin.template:
    src: websocket-map.conf.j2
    dest: /etc/nginx/conf.d/00-websocket-map.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Deploy budget vhost to sites-available
  ansible.builtin.template:
    src: actual-budget.conf.j2
    dest: "/etc/nginx/sites-available/{{ budget_server_name }}.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable budget vhost
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ budget_server_name }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ budget_server_name }}.conf"
    state: link
    force: true
  notify: Reload nginx

- name: Deploy node_exporter vhost to sites-available
  ansible.builtin.template:
    src: node_exporter.conf.j2
    dest: "/etc/nginx/sites-available/{{ node_exporter }}.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable node_exporter vhost
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ node_exporter }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ node_exporter }}.conf"
    state: link
    force: true
  notify: Reload nginx


- name: Validate nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false
  
- name: Ensure nginx is running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true