---
- name: Create data dir
  ansible.builtin.file:
    path: "{{ actual_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Actual data volume dir
  ansible.builtin.file:
    path: "{{ actual_data_dir }}/data"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy docker-compose
  ansible.builtin.template:
    src: "{{ docker_compose_template }}"
    dest: "{{ actual_data_dir }}/docker-compose.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Start Actual Budget
  community.docker.docker_compose_v2:
    project_src: "{{ actual_data_dir }}"
    state: present
    pull: missing
    remove_orphans: true

- name: Wait for Actual Budget on localhost
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ actual_port }}"
    timeout: 120
    delay: 5