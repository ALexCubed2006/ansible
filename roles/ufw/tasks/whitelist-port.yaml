---
- name: "List numbered UFW rules for port {{ port_item.port }}"
  ansible.builtin.shell: |
    ufw status numbered \
      | grep -E '[[:space:]]{{ port_item.port }}(/tcp)?[[:space:]]' \
      | sed -n 's/^\[\s*\([0-9]*\)\].*/\1/p' \
      | sort -rn
  register: _ufw_port_rule_nums
  changed_when: false
  failed_when: false

- name: "Remove existing UFW rules for port {{ port_item.port }}"
  ansible.builtin.command: "ufw --force delete {{ item }}"
  loop: "{{ _ufw_port_rule_nums.stdout_lines | default([]) | select('match', '^[0-9]+$') | list }}"
  when: item | length > 0

- name: "Allow TCP {{ port_item.port }} from whitelisted IPs"
  community.general.ufw:
    rule: allow
    port: "{{ port_item.port }}"
    proto: tcp
    from_ip: "{{ item }}"
    comment: "{{ port_item.prefix }}-{{ item }}"
  loop: "{{ allowed_ips }}"

- name: "Deny any other traffic to TCP {{ port_item.port }}"
  community.general.ufw:
    rule: deny
    port: "{{ port_item.port }}"
    proto: tcp
    comment: "{{ port_item.prefix }}-deny-rest"
