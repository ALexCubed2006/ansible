---
- name: Ensure loki project directory present
  ansible.builtin.file:
    path: "{{ loki_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure loki config directory present
  ansible.builtin.file:
    path: "{{ loki_dir }}/config"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy loki config
  ansible.builtin.template:
    src: loki.yaml.j2
    dest: "{{ loki_dir }}/config/loki.yaml"
    owner: root
    group: root
    mode: "0644"
  register: _loki_config

- name: Deploy loki docker-compose
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ loki_dir }}/docker-compose.yaml"
    owner: root
    group: root
    mode: "0644"
  register: _loki_compose

- name: Remove stale loki compose template artifact
  ansible.builtin.file:
    path: "{{ loki_dir }}/docker-compose.yaml.j2"
    state: absent

- name: Create loki data directory
  ansible.builtin.file:
    path: "{{ loki_dir }}/data"
    state: directory
    owner: "10001"
    group: "10001"
    mode: "0755"

- name: Ensure loki stack is running
  community.docker.docker_compose_v2:
    project_src: "{{ loki_dir }}"
    state: present
    recreate: always
    pull: missing
    remove_orphans: true

- name: Wait for loki on localhost
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ loki_upstream_port }}"
    timeout: 120
    delay: 5
