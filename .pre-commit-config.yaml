---
repos:
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types: [ yaml ]
        exclude: ^vaults/allowed-ips\.secrets\.yaml$

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: [ -c, .yamllint ]
        files: \.(yaml|yml)$
        exclude: ^vaults/allowed-ips\.secrets\.yaml$