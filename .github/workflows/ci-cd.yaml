name: CI/CD pipeline

on:
  push:
    branches: [ main ]
  pull_request: 
    branches: [ main ]

jobs:
  validate-configs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
    
      - name: Install tools
        run: |
          pip install ansible ansible-lint yamllint
          ansible-galaxy collection install -r requirements.yaml

      - name: Yamllint
        run: |
          yamllint -c .yamllint playbooks roles inventories
      
      - name: Ansible-lint
        run: ansible-lint --offline playbooks/
