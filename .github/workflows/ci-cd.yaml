name: CI/CD pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  prettier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Prettier
        run: npm install --no-save prettier@3.4.2 prettier-plugin-yaml@1.2.0

      - name: Prettier check
        run: |
          npx prettier --check \
            "playbooks/**/*.{yaml,yml}" \
            "roles/**/*.{yaml,yml}" \
            "inventories/**/*.{yaml,yml}" \
            ".github/workflows/*.{yaml,yml}" \
            ".prettierrc.yaml"

  validate-configs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          pip install ansible ansible-lint yamllint
          ansible-galaxy collection install -r requirements.yaml

      - name: Prepare vault_pass file
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$ANSIBLE_VAULT_PASSWORD" | tr -d '\n\r' > .vault_pass

      - name: Yamllint
        run: |
          yamllint -c .yamllint playbooks roles inventories

      - name: Ansible-lint
        run: ansible-lint --offline playbooks/
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          ANSIBLE_VAULT_PASSWORD_FILE: ${{ github.workspace }}/.vault_pass

      - name: Remove vault password file
        if: always()
        run: rm -f .vault_pass

  deploy:
    runs-on: ubuntu-latest
    needs: validate-configs

    steps:
      - name: Checkout
        uses: actions/checkout@v4